{% set name = "python-memcached" %}
{% set version = "1.62" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/linsomniac/{{ name }}/archive/refs/tags/{{ version }}.tar.gz
  sha256: 2877f0885ade0c4c6871c863914838d23c955621f1a9f56a9b941dd1facb250a

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python
    - wheel
    - setuptools
  run:
    - python

test:
  source_files:
    - tests/test_setmulti.py
  imports:
    - memcache
  commands:
    - pip check
    - pytest -v tests/test_setmulti.py
  requires:
    - pip
    - pytest

about:
  home: https://github.com/linsomniac/python-memcached
  license_file: PSF.LICENSE
  license: PSF-2.0
  license_family: PSF
  summary: Pure python memcached client
  description: |
    This software is a 100% Python interface to the memcached memory cache daemon.
    It is the client side software which allows storing values in one or more, possibly
    remote, memcached servers. Search google for memcached for more information.
  dev_url: https://github.com/linsomniac/python-memcached
  doc_url: https://github.com/linsomniac/python-memcached

extra:
  recipe-maintainers:
    - pmlandwehr
